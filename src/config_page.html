<!doctype html>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 var(--openidea-font-ui, system-ui, sans-serif);
    color: var(--openidea-fg);
    background: var(--openidea-bg);
  }
  .qp { display: flex; flex-direction: column; gap: 10px; padding: 10px; min-height: 100vh; }
  .cards { display: grid; gap: 10px; }
  @media (min-width: 720px) { .cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .card {
    border: 1px solid var(--openidea-border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--openidea-bg-elevated, var(--openidea-bg));
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h2 { font-size: 13px; margin: 0; color: var(--openidea-fg-strong); }
  h3 { font-size: 13px; margin: 0 0 4px; color: var(--openidea-fg-strong); }
  .hint { color: var(--openidea-fg-muted); font-size: 11px; margin: 0; }
  .hint code { font-family: var(--openidea-font-mono, monospace); color: var(--openidea-fg); }
  textarea, input[type="text"] {
    width: 100%;
    font-family: var(--openidea-font-mono, monospace);
    font-size: 12px;
    color: var(--openidea-fg);
    background: var(--openidea-bg-input, transparent);
    border: 1px solid var(--openidea-border);
    border-radius: 5px;
    padding: 6px 8px;
    outline: none;
    resize: vertical;
  }
  textarea:focus, input[type="text"]:focus { border-color: var(--openidea-focus-ring, var(--openidea-accent)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    color: var(--openidea-fg-muted); background: var(--openidea-bg-hover, transparent);
    border: 1px solid var(--openidea-border);
  }
  .chip.active { color: var(--openidea-fg-on-accent); background: var(--openidea-accent); border-color: var(--openidea-accent); }
  .btn {
    font-size: 12px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    color: var(--openidea-fg); background: var(--openidea-bg-hover, transparent);
    border: 1px solid var(--openidea-border);
  }
  .btn.primary { color: var(--openidea-fg-on-accent); background: var(--openidea-accent); border-color: var(--openidea-accent); }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.6; cursor: default; filter: none; }
  .agents { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .agent {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px;
    border: 1px solid var(--openidea-border); border-radius: 7px; cursor: grab;
    background: var(--openidea-bg);
  }
  .agent:hover { background: var(--openidea-bg-hover, transparent); }
  .logo { width: 26px; height: 26px; border-radius: 6px; background: var(--openidea-bg-elevated, transparent); flex: none; display: flex; align-items: center; justify-content: center; color: var(--openidea-fg); overflow: hidden; }
  .logo img, .logo svg { width: 100%; height: 100%; display: block; object-fit: contain; }
  .meta { flex: 1 1 auto; min-width: 0; }
  .nm { color: var(--openidea-fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm { color: var(--openidea-fg-muted); font-family: var(--openidea-font-mono, monospace); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ops { display: flex; gap: 2px; flex: none; }
  .iconbtn { border: none; background: transparent; cursor: pointer; font-size: 13px; padding: 3px; border-radius: 5px; color: var(--openidea-fg-muted); }
  .iconbtn:hover { background: var(--openidea-bg-hover, transparent); color: var(--openidea-fg); }
  .iconbtn.danger:hover { color: var(--openidea-danger); }
  .empty { color: var(--openidea-fg-muted); font-size: 12px; text-align: center; margin: 12px 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
  .status { font-size: 12px; }
  .status.ok { color: var(--openidea-success, var(--openidea-accent)); }
  .status.bad { color: var(--openidea-danger); }
  dialog {
    border: 1px solid var(--openidea-border); border-radius: 10px; padding: 0;
    background: var(--openidea-bg-elevated, var(--openidea-bg)); color: var(--openidea-fg);
    width: min(420px, 92vw);
  }
  .form { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--openidea-fg-muted); }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--openidea-fg-muted); }
  .icons { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 34px; height: 34px; padding: 3px; border-radius: 7px; cursor: pointer; background: var(--openidea-bg); border: 1px solid var(--openidea-border); }
  .sw.active { border-color: var(--openidea-accent); outline: 1px solid var(--openidea-accent); }
  .sw-in { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--openidea-fg); }
  .sw-in img, .sw-in svg { width: 100%; height: 100%; object-fit: contain; display: block; }
  .upload { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--openidea-link, var(--openidea-accent)); text-decoration: underline; }
  .err { color: var(--openidea-danger); font-size: 12px; margin: 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
</style>

<div class="qp">
  <div class="cards">
    <section class="card">
      <div class="hd"><h2>路径模板</h2></div>
      <p class="hint">
        占位符：<code>{path}</code> 相对路径 · <code>{start}</code>/<code>{end}</code> 行号 ·
        条件段 <code>[ONE:…]</code> 仅单行 · <code>[MANY:…]</code> 多行
      </p>
      <textarea id="tpl" rows="3" spellcheck="false" placeholder="{path}"></textarea>
      <div class="chips" id="presets"></div>
    </section>

    <section class="card">
      <div class="hd"><h2>Agent 列表</h2><button class="btn" id="add">+ 新增</button></div>
      <ul class="agents" id="agents"></ul>
      <p class="empty" id="empty" hidden>还没有 Agent，点右上角「新增」添加一个。</p>
    </section>
  </div>

  <footer class="bar">
    <span class="status" id="status"></span>
    <button class="btn primary" id="save">保存</button>
  </footer>
</div>

<dialog id="dlg">
  <div class="form">
    <h3 id="dlg-title">新增 Agent</h3>
    <label>名称<input id="f-name" type="text" maxlength="40" placeholder="如 Claude Code"></label>
    <label>启动命令<input id="f-cmd" type="text" maxlength="200" placeholder="如 claude 或 codebuddy"></label>
    <div class="field">
      <span>图标</span>
      <div class="icons" id="f-icons"></div>
      <label class="upload">上传 SVG<input id="f-file" type="file" accept="image/svg+xml,.svg" hidden><span>选择文件…</span></label>
    </div>
    <p class="err" id="dlg-err" hidden></p>
    <div class="actions">
      <button type="button" class="btn" id="dlg-cancel">取消</button>
      <button type="button" class="btn primary" id="dlg-ok">确定</button>
    </div>
  </div>
</dialog>

<script>
  (() => {
    // 由插件替换成起始状态（一个 JSON 对象）；保持字符串形式，格式化工具不会破坏它。
    const START = "__START__";
    const $ = (id) => document.getElementById(id);
    // 内置图标统一用 currentColor 描边，随主题明暗自适应；每个品牌一个可辨识的线性图形。
    const GLYPH = {
      claude: '<path d="M12 4v16M5 8l14 8M19 8L5 16"/>',
      codex: '<path d="M5 7l5 5-5 5M12 17h7"/>',
      opencode: '<path d="M9 5c-2 0-2 2-2 3s0 3-2 3c2 0 2 2 2 3s0 3 2 3M15 5c2 0 2 2 2 3s0 3 2 3c-2 0-2 2-2 3s0 3-2 3"/>',
      pi: '<path d="M5 8h14M8 8v9M16 8v9"/>',
      codebuddy: '<path d="M4 6h16v10H9l-4 4v-4H4z"/>',
      qoder: '<circle cx="11" cy="11" r="6"/><path d="M15 15l4 4"/>',
    };
    const KEYS = Object.keys(GLYPH);
    const glyphSvg = (key) =>
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${GLYPH[key] || GLYPH.qoder}</svg>`;

    const state = {
      config: (START && START.config) || { version: 1, pathTemplate: "{path}", presetId: "claude", agents: [] },
      maxSvg: (START && START.maxSvg) || 16384,
      presets: (START && START.presets) || [],
    };

    const tpl = $("tpl"), agentsEl = $("agents"), emptyEl = $("empty"), statusEl = $("status");
    const dlg = $("dlg"), fName = $("f-name"), fCmd = $("f-cmd"), fIcons = $("f-icons"), dlgErr = $("dlg-err");
    let editing = -1, pickIcon = null, dragFrom = -1;

    // 生成图标元素：自定义 SVG 用 <img>（内容已由 Rust 侧净化），内置图标用内联 <svg>（跟随主题色）。
    function iconEl(icon, cls) {
      const box = document.createElement("span");
      box.className = cls || "logo";
      if (icon && icon.type === "svg" && icon.data) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = "data:image/svg+xml;utf8," + encodeURIComponent(icon.data);
        box.appendChild(img);
      } else {
        box.innerHTML = glyphSvg(icon && icon.key);
      }
      return box;
    }

    function toast(msg, ok = true) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (ok ? "ok" : "bad");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (statusEl.textContent = ""), 3000);
    }

    function renderPresets() {
      const box = $("presets");
      box.innerHTML = "";
      state.presets.forEach((p) => {
        const b = document.createElement("button");
        b.className = "chip" + (p.template === tpl.value ? " active" : "");
        b.textContent = p.name;
        b.title = p.template;
        b.onclick = () => { tpl.value = p.template; state.config.presetId = p.id; renderPresets(); };
        box.appendChild(b);
      });
    }

    function renderAgents() {
      agentsEl.innerHTML = "";
      emptyEl.hidden = state.config.agents.length > 0;
      state.config.agents.forEach((a, i) => {
        const li = document.createElement("li");
        li.className = "agent";
        li.draggable = true;
        const logo = iconEl(a.icon);
        const meta = document.createElement("div"); meta.className = "meta";
        const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = a.name || "(未命名)";
        const cm = document.createElement("div"); cm.className = "cm"; cm.textContent = a.command || "";
        meta.append(nm, cm);
        const ops = document.createElement("div"); ops.className = "ops";
        const edit = document.createElement("button"); edit.className = "iconbtn"; edit.title = "编辑"; edit.textContent = "✎";
        edit.onclick = () => openDialog(i);
        const del = document.createElement("button"); del.className = "iconbtn danger"; del.title = "删除"; del.textContent = "🗑";
        del.onclick = () => { state.config.agents.splice(i, 1); renderAgents(); };
        ops.append(edit, del);
        li.append(logo, meta, ops);
        li.ondragstart = (e) => { dragFrom = i; e.dataTransfer.effectAllowed = "move"; };
        li.ondragover = (e) => e.preventDefault();
        li.ondrop = (e) => {
          e.preventDefault();
          if (dragFrom < 0 || dragFrom === i) return;
          const [moved] = state.config.agents.splice(dragFrom, 1);
          state.config.agents.splice(i, 0, moved);
          dragFrom = -1;
          renderAgents();
        };
        agentsEl.appendChild(li);
      });
      renderPresets();
    }

    function renderIconPicker() {
      fIcons.innerHTML = "";
      KEYS.forEach((k) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sw" + (pickIcon && pickIcon.type === "builtin" && pickIcon.key === k ? " active" : "");
        b.appendChild(iconEl({ type: "builtin", key: k }, "sw-in"));
        b.onclick = () => { pickIcon = { type: "builtin", key: k }; renderIconPicker(); };
        fIcons.appendChild(b);
      });
      if (pickIcon && pickIcon.type === "svg") {
        const b = document.createElement("button");
        b.type = "button"; b.className = "sw active"; b.title = "自定义 SVG";
        b.appendChild(iconEl(pickIcon, "sw-in"));
        fIcons.appendChild(b);
      }
    }

    function openDialog(i) {
      editing = i;
      dlgErr.hidden = true;
      const a = i >= 0 ? state.config.agents[i] : null;
      $("dlg-title").textContent = a ? "编辑 Agent" : "新增 Agent";
      fName.value = a ? a.name : "";
      fCmd.value = a ? a.command : "";
      pickIcon = a ? JSON.parse(JSON.stringify(a.icon)) : { type: "builtin", key: KEYS[0] };
      renderIconPicker();
      dlg.showModal();
    }

    $("add").onclick = () => openDialog(-1);
    $("dlg-cancel").onclick = () => dlg.close();
    $("f-file").onchange = async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const max = state.maxSvg || 16384;
      if (f.size > max) { dlgErr.textContent = `SVG 超过 ${Math.round(max / 1024)} KiB`; dlgErr.hidden = false; return; }
      const text = await f.text();
      if (!/^\s*<svg/i.test(text)) { dlgErr.textContent = "请选择以 <svg 开头的文件"; dlgErr.hidden = false; return; }
      pickIcon = { type: "svg", data: text };
      renderIconPicker();
      dlgErr.hidden = true;
    };
    $("dlg-ok").onclick = () => {
      const name = fName.value.trim(), command = fCmd.value.trim();
      if (!name) { dlgErr.textContent = "名称不能为空"; dlgErr.hidden = false; return; }
      if (!command) { dlgErr.textContent = "启动命令不能为空"; dlgErr.hidden = false; return; }
      const agent = { id: editing >= 0 ? state.config.agents[editing].id : "a" + Date.now().toString(36), name, command, icon: pickIcon };
      if (editing >= 0) state.config.agents[editing] = agent;
      else state.config.agents.push(agent);
      dlg.close();
      renderAgents();
    };

    const saveBtn = $("save");
    // 保存往返期间禁用按钮，避免重复提交。
    const setSaving = (on) => { saveBtn.disabled = on; saveBtn.textContent = on ? "保存中…" : "保存"; };
    saveBtn.onclick = () => {
      state.config.pathTemplate = tpl.value;
      state.config.version = 1;
      setSaving(true);
      openidea.postMessage(JSON.stringify({ type: "save", config: state.config }));
    };
    tpl.addEventListener("input", renderPresets);

    openidea.onMessage((raw) => {
      let m;
      try { m = JSON.parse(raw); } catch { return; }
      setSaving(false);
      if (m.type === "saved") {
        if (m.config) { state.config = m.config; tpl.value = m.config.pathTemplate || ""; renderAgents(); }
        toast("已保存");
      } else if (m.type === "error") {
        toast(m.message || "保存失败", false);
      }
    });

    tpl.value = state.config.pathTemplate || "";
    renderAgents();
  })();
</script>
